# Tiltmeter for Repo Pulse.
version: 1

subscriptions:
  # GitHub publishes one OpenAPI description per REST API version. This code was written
  # against 2022-11-28; follow 2026-03-10, the first version with breaking changes.
  - openapi: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.2026-03-10.json
    baseline: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.2022-11-28.json
    provider: api.github.com

llm:
  enabled: false

fix:
  agent: claude-code
  # Run the tests on the agent's edits; a failure goes back to the agent.
  test_command: node --test test/pulse.test.ts
  # GitHub's runners cannot cut the network for the tests; they still get no secrets.
  test_network: true
